
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Student | Student Record System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080a0e;
    color: #eee;
    min-height: 100vh;
}

header {
    padding: 20px 5%;
    border-bottom: 1px solid #292d34;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    font-size: 19px;
    font-weight: bold;
}

.brand span {
    color: #aeb8c7;
    margin-right: 10px;
}

header a {
    color: #ccc;
    text-decoration: none;
}

header a:hover {
    color: white;
}

.container {
    max-width: 760px;
    margin: 40px auto;
    padding: 20px;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
}

.heading .icon {
    font-size: 42px;
    margin-bottom: 12px;
    color: #c3ccd8;
}

.heading h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.heading p {
    color: #929ba8;
    font-size: 15px;
}

.form-box {
    background: linear-gradient(145deg, #171b22, #101318);
    border: 1px solid #343b46;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 12px 35px rgba(0,0,0,.3);
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 14px;
    color: #d5d9df;
    font-weight: 600;
}

input, select, textarea {
    width: 100%;
    padding: 13px 14px;
    background: #0d1117;
    color: #eee;
    border: 1px solid #414955;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    font-family: Arial, sans-serif;
    transition: .25s;
}

input:focus, select:focus, textarea:focus {
    border-color: #a6b3c4;
    box-shadow: 0 0 0 2px rgba(170,185,205,.09);
}

input::placeholder, textarea::placeholder {
    color: #737e8d;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input[type="file"] {
    padding: 11px;
    cursor: pointer;
}

input[type="file"]::file-selector-button {
    background: #303741;
    color: white;
    border: 1px solid #515c6b;
    padding: 8px 13px;
    border-radius: 5px;
    margin-right: 12px;
    cursor: pointer;
}

.photo-note {
    color: #858e9b;
    font-size: 12px;
}

.submit-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    background: linear-gradient(135deg, #c4ccd7, #858f9d);
    color: #101318;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: .3s;
}

.submit-btn:hover {
    background: #e0e5ec;
    transform: translateY(-2px);
}

.back {
    display: block;
    width: fit-content;
    margin: 25px auto 0;
    padding: 11px 25px;
    border: 1px solid #687382;
    border-radius: 30px;
    text-decoration: none;
    color: #d3d9e2;
    transition: .3s;
}

.back:hover {
    background: #252b34;
}

footer {
    text-align: center;
    color: #737d8a;
    border-top: 1px solid #292d34;
    padding: 22px;
    margin-top: 35px;
    font-size: 13px;
}

@media(max-width: 600px) {
    .container {
        margin: 20px auto;
        padding: 15px;
    }

    .form-box {
        padding: 20px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .heading h1 {
        font-size: 28px;
    }

    header {
        gap: 12px;
    }

    .brand {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <span>🎓</span> Student Record Management System
    </div>
    <a href="/">Home</a>
</header>

<div class="container">

    <div class="heading">
        <div class="icon">♙+</div>
        <h1>Add Student</h1>
        <p>Enter student details to add a new record</p>
    </div>

    <div class="form-box">

        <form method="POST" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="field">
                    <label>Roll Number *</label>
                    <input type="text" name="roll"
                           placeholder="Enter roll number" required>
                </div>

                <div class="field">
                    <label>Student Name *</label>
                    <input type="text" name="name"
                           placeholder="Enter student name" required>
                </div>

                <div class="field">
                    <label>Course *</label>
                    <input type="text" name="course"
                           placeholder="Enter course" required>
                </div>

                <div class="field">
                    <label>Email *</label>
                    <input type="email" name="email"
                           placeholder="Enter email address" required>
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel" name="phone"
                           placeholder="Enter phone number">
                </div>

                <div class="field">
                    <label>CGPA</label>
                    <input type="number" name="cgpa"
                           placeholder="Enter CGPA"
                           min="0" max="10" step="0.01">
                </div>

                <div class="field">
                    <label>Semester</label>
                    <select name="semester">
                        <option value="">Select semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

                <div class="field full">
                    <label>Student Photo</label>
                    <input type="file" name="photo" accept="image/*">
                    <span class="photo-note">Select a student image from your device</span>
                </div>

                <div class="field full">
                    <label>Address</label>
                    <textarea name="address"
                              placeholder="Enter complete address"></textarea>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                + &nbsp; Add Student
            </button>

        </form>

    </div>

    <a href="/" class="back">← Back to Home</a>

</div>

<footer>
    Student Record Management System
</footer>

</body>
</html>
