
<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <style>
        body {
            font-family: Arial;
            background: #e0e7ff;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #4338ca; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 20px;
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Add Student Record</h1>

        <form method="POST">
            <input type="text" name="name" placeholder="Student Name" required>
            <input type="text" name="roll" placeholder="Roll Number" required>
            <input type="text" name="course" placeholder="Course" required>
            <input type="email" name="email" placeholder="Email" required>
            <br><br>
            <button type="submit">Save Student</button>
        </form>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
