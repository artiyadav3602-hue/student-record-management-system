
<!DOCTYPE html>
<html>
<head>
    <title>Student Record Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            margin: 0;
            padding: 50px 20px;
            text-align: center;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 18px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #4338ca;
        }

        p {
            color: #64748b;
        }

        a {
            display: block;
            background: #4f46e5;
            color: white;
            padding: 15px;
            margin: 15px;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        a:hover {
            background: #312e81;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Student Record Management System</h1>
        <p>Welcome to Student Management Portal</p>

        <a href="/add">Add Student</a>
        <a href="/view">View Students</a>
        <a href="/search">Search Student</a>
        <a href="/update">Update Student</a>
        <a href="/delete">Delete Student</a>
    </div>
</body>
</html>
