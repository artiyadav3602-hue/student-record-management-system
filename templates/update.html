
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080a0f;
            color: #e5e7eb;
            text-align: center;
            padding: 40px 15px;
        }

        .box {
            background: #151922;
            padding: 35px;
            border: 1px solid #343a46;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #e5e7eb;
            letter-spacing: 1px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 9px 0;
            background: #0d1119;
            color: white;
            border: 1px solid #555e6c;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #aab4c2;
        }

        button {
            background: #343c49;
            color: white;
            padding: 12px 28px;
            border: 1px solid #77808e;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #465160;
        }

        .message {
            color: #cbd5e1;
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #dce3ed;
            text-decoration: none;
            border: 1px solid #77808e;
            padding: 11px 22px;
            border-radius: 7px;
        }

        a:hover {
            background: #252b36;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>UPDATE STUDENT</h1>

        <form method="POST">

            <input type="text" name="roll"
                   placeholder="Enter Roll Number" required>

            <input type="text" name="name"
                   placeholder="New Student Name" required>

            <input type="text" name="course"
                   placeholder="New Course" required>

            <input type="email" name="email"
                   placeholder="New Email" required>

            <input type="tel" name="phone"
                   placeholder="New Phone Number">

            <input type="number" name="cgpa"
                   placeholder="New CGPA" min="0" max="10"
                   step="0.01">

            <input type="text" name="semester"
                   placeholder="New Semester">

            <input type="text" name="address"
                   placeholder="New Address">

            <br><br>

            <button type="submit">Update Record</button>

        </form>

        <p class="message">{{ message }}</p>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
