
<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080a0f;
            color: #e5e7eb;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            background: #151922;
            padding: 35px;
            border: 1px solid #343a46;
            border-radius: 15px;
            max-width: 480px;
            margin: auto;
        }

        h1 {
            color: #e5e7eb;
            letter-spacing: 1px;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 15px 0;
            background: #0d1119;
            color: white;
            border: 1px solid #555e6c;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #aab4c2;
        }

        button {
            background: #343c49;
            color: white;
            padding: 12px 27px;
            border: 1px solid #77808e;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #465160;
        }

        .message {
            color: #cbd5e1;
            margin-top: 22px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #dce3ed;
            text-decoration: none;
            border: 1px solid #77808e;
            padding: 11px 22px;
            border-radius: 7px;
        }

        a:hover {
            background: #252b36;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>DELETE STUDENT</h1>

        <form method="POST"
              onsubmit="return confirm('Are you sure you want to delete this student record?');">

            <input type="text" name="roll"
                   placeholder="Enter Roll Number" required>

            <br><br>

            <button type="submit">Delete Student</button>

        </form>

        <p class="message">{{ message }}</p>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
