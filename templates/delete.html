<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial;
            background: #e0e7ff;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
        }
        h1 { color: #4338ca; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            background: #dc2626;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 20px;
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Delete Student Record</h1>

        <form method="POST">
            <input type="text" name="roll" placeholder="Enter Roll Number" required>
            <br><br>
            <button type="submit">Delete Student</button>
        </form>

        <p>{{ message }}</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
