<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
    <style>
        body {
            font-family: Arial;
            background: #e0e7ff;
            text-align: center;
            padding: 40px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 850px;
            margin: auto;
            overflow-x: auto;
        }
        h1 { color: #4338ca; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        th {
            background: #4f46e5;
            color: white;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Student Records</h1>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Course</th>
                <th>Email</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.roll }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.email }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
